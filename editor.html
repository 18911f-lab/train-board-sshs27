<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nゲージ 車両カタログ & 備考テロップ JSONビルダー</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&display=swap');

    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --panel-border: #30363d;
      --primary-color: #238636;
      --primary-hover: #2ea043;
      --accent-color: #58a6ff;
      --danger-color: #da3633;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --input-bg: #0d1117;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 16px 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      padding: 8px 14px;
      background: var(--panel-border);
      color: var(--text-main);
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-nav:hover { background: #484f58; }

    .notice {
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid var(--accent-color);
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }

    @media (max-width: 992px) {
      .grid-container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 16px;
      border-left: 4px solid var(--accent-color);
      padding-left: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .picker-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    /* Word風 書式ツールバー */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: #21262d;
      border: 1px solid var(--panel-border);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 6px 10px;
    }

    .toolbar-btn {
      padding: 4px 10px;
      background: #30363d;
      border: 1px solid #484f58;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .toolbar-btn:hover { background: #484f58; }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #30363d;
      border: 1px solid #484f58;
      border-radius: 4px;
      padding: 2px 6px;
    }

    .color-picker-wrapper input[type="color"] {
      border: none;
      width: 22px;
      height: 22px;
      cursor: pointer;
      background: none;
    }

    textarea.toolbar-textarea {
      border-radius: 0 0 6px 6px;
      white-space: pre-wrap; /* 改行の視認対応 */
    }

    /* テロップライブプレビュー (マルチライン/改行対応) */
    .preview-box {
      background: #000;
      border: 2px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
      min-height: 52px;
      display: flex;
      align-items: center;
      overflow-x: auto;
    }

    .preview-text {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.04em;
      white-space: pre-wrap; /* 改行を画面にそのまま反映 */
      line-height: 1.4;
    }

    @keyframes remark-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.1; }
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary-color); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger-color); color: #fff; }
    .btn-secondary { background: #21262d; border: 1px solid var(--panel-border); color: var(--text-main); }
    .btn-secondary:hover { background: #30363d; }

    .item-list {
      max-height: 580px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: #0d1117;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      margin-right: 12px;
    }

    .item-title {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 15px;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: #21262d;
      border: 1px solid var(--panel-border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #8b949e;
      display: inline-flex;
      align-items: center;
    }

    .json-preview {
      width: 100%;
      height: 280px;
      background: #000;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #7ee787;
      font-family: monospace;
      padding: 12px;
      font-size: 12px;
      resize: vertical;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>📝 車両カタログ & 備考テロップ JSONビルダー</h1>
    <div>
      <a href="index.html" target="_blank" class="btn-nav">🚆 ディスプレイ画面を表示</a>
    </div>
  </header>

  <div class="notice">
    💡 <b>更新情報</b>:<br>
    ・車両名および種別候補は、便利なプルダウンから選んで簡単にセットできます。<br>
    ・下部案内テロップは改行（Enter）に対応しています。Word風ツールバーで太字・文字色・点滅も自由自在です。
  </div>

  <div class="grid-container">
    <!-- 車両登録フォーム -->
    <div>
      <div class="card">
        <h2 id="formTitle">➕ 車両カタログデータの追加 / 編集</h2>
        <form id="vehicleForm" onsubmit="saveVehicle(event)">
          <input type="hidden" id="editIndex" value="-1">

          <!-- 車両名（直接入力 ＋ プルダウンピック） -->
          <div class="form-group">
            <label>車両名 (vehicle)</label>
            <input type="text" id="v_vehicle" placeholder="例: 103系, E233系3000, E259系" required>
            
            <div class="picker-row">
              <select id="presetVehicleSelect">
                <option value="">-- 標準車両名一覧から選択 --</option>
                <option value="103系">103系</option>
                <option value="E001系">E001系 (TRAIN SUITE 四季島)</option>
                <option value="E233系3000">E233系3000</option>
                <option value="E259系">E259系</option>
                <option value="281系">281系 (はるか)</option>
                <option value="HC85系">HC85系 (ひだ/南紀)</option>
                <option value="5050系4000">5050系4000</option>
                <option value="5050系Hikarie">5050系Hikarie号</option>
              </select>
              <button type="button" class="btn btn-secondary" onclick="applySelectedVehicle()">セット</button>
            </div>
          </div>

          <!-- 種別画像候補プルダウンピック -->
          <div class="form-group">
            <label>種別画像候補 (candidates: 共通キー)</label>
            <input type="text" id="v_candidates" placeholder="例: オレンジ快速.単体大, 緑普通.宇都宮" required>
            
            <div class="picker-row">
              <select id="presetCandidateSelect">
                <option value="">-- 全駅型共通の種別キーワード一覧から選択 --</option>
                <option value="オレンジ快速.単体大">オレンジ快速.単体大</option>
                <option value="オレンジ快速.宇都宮">オレンジ快速.宇都宮</option>
                <option value="オレンジ快速.高崎">オレンジ快速.高崎</option>
                <option value="オレンジ快速.東海道">オレンジ快速.東海道</option>
                <option value="オレンジ快速アクティー.単体大">オレンジ快速アクティー.単体大</option>
                <option value="オレンジ快速アーバン.単体大">オレンジ快速アーバン.単体大</option>
                <option value="オレンジ快速ラビット.単体大">オレンジ快速ラビット.単体大</option>
                <option value="緑普通.宇都宮">緑普通.宇都宮</option>
                <option value="緑普通.高崎">緑普通.高崎</option>
                <option value="緑普通.東海道">緑普通.東海道</option>
                <option value="緑普通.横須賀">緑普通.横須賀</option>
                <option value="グレー普通.単体大">グレー普通.単体大</option>
                <option value="グレー普通.宇都宮">グレー普通.宇都宮</option>
                <option value="グレー普通.高崎">グレー普通.高崎</option>
                <option value="スカイブルー特別快速.単体大">スカイブルー特別快速.単体大</option>
                <option value="スカイブルー特別快速.宇都宮">スカイブルー特別快速.宇都宮</option>
                <option value="スカイブルー特別快速.高崎">スカイブルー特別快速.高崎</option>
                <option value="スカイブルー特別快速.東海道">スカイブルー特別快速.東海道</option>
                <option value="相鉄線">相鉄線</option>
                <option value="5050専用急行">5050専用急行</option>
                <option value="E001専用四季島">E001専用四季島</option>
                <option value="Hikarei専用快速急行">Hikarei専用快速急行</option>
                <option value="特急単体大">特急単体大</option>
              </select>
              <button type="button" class="btn btn-secondary" onclick="addSelectedCandidate()">➕ 追加</button>
            </div>
          </div>

          <!-- 下部備考テロップ入力 ＋ 改行対応 ＋ Word風書式ツールバー -->
          <div class="form-group">
            <label>下部案内テロップ文 (remark: 改行対応)</label>

            <!-- 書式ツールバー -->
            <div class="toolbar">
              <button type="button" class="toolbar-btn" onclick="applyFormat('bold')"><b>B</b> 太字 (§b)</button>
              <button type="button" class="toolbar-btn" onclick="applyFormat('blink')">⚡ 点滅 (§f)</button>
              <div class="color-picker-wrapper">
                <span style="font-size:11px; color:#fff;">🎨 文字色:</span>
                <input type="color" id="textColorPicker" value="#ffaa00" onchange="applyColor(this.value)">
              </div>
              <button type="button" class="toolbar-btn" onclick="applyFormat('reset')">🔄 装飾リセット (§n)</button>
            </div>

            <textarea id="v_remark" class="toolbar-textarea" rows="4" placeholder="例: §c#ffaa00§b【お知らせ】§n&#10;ここに改行を入れた文章を入力できます。" oninput="updateLivePreview()" required></textarea>

            <!-- リアルタイム ライブプレビュー (改行対応) -->
            <label style="margin-top: 8px;">📺 下部テロップ表示イメージ（改行対応ライブプレビュー）:</label>
            <div class="preview-box">
              <div class="preview-text" id="livePreview"></div>
            </div>
          </div>

          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="saveBtn">➕ リストに追加</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 フォームリセット</button>
          </div>
        </form>
      </div>

      <!-- JSON出力カード -->
      <div class="card">
        <h2>📁 JSONファイルの書き出し (Export) / 読み込み (Import)</h2>
        <textarea id="jsonPreview" class="json-preview" readonly></textarea>
        <div class="action-bar">
          <button class="btn btn-primary" onclick="downloadCatalogJson()">💾 JSONをダウンロード (書き出し)</button>
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 既存のJSONを読み込む</button>
          <button class="btn btn-secondary" onclick="reloadStandardCatalog()">🔄 標準JSONへリセット</button>
          <input type="file" id="importFile" style="display:none" accept=".json" onchange="importCatalogJson(event)">
        </div>
      </div>
    </div>

    <!-- リスト一覧 -->
    <div>
      <div class="card">
        <h2>🚆 車両カタログ一覧 (<span id="itemCount">0</span>件)</h2>
        <div class="item-list" id="vehicleList">
          <!-- JSで動的生成 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 標準 `vehicle_catalog.json` 内データ（「成田エクスプレス15号」排除済み）
    const standardDefaultCatalog = [
      {
        "vehicle": "103系",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は§b§c#ff9900中央線快速 103系§nです。先代の§c#cccccc101系§nの後継として登場し、駅間距離が短い通勤路線に特化した§b§c#00ffff加速性能§nを重視した設計となっています。中央線を象徴する§b§c#ff4400「朱色1号」§nの鮮やかな単色塗りは、当時の§b§c#ffcc00『国電』§nの代名詞として沿線で広く親しまれました。唸りを上げるモーター音と共に過密ダイヤを捌き続けた、§b§c#ffff00高度経済成長期の立役者§n。首都圏の輸送を力強く支えた色褪せない§b§c#ffaaaa名車の走り§nをご覧ください！☆彡",

      {
        "vehicle": "5050系4000",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は東急東横線の主力、§b§c#cccccc東急5050系4000番台§nです。従来の8両から輸送力を増強した§b§c#00ffff10両編成§nのグループで、車体に巻かれた鮮やかな§b§c#e60033チェリーレッドの帯§nが特徴です。副都心線から西武線、東武線、さらには相鉄線方面まで、広域にわたる直通ネットワークの要として活躍中。§b§c#ff9900複雑で多彩なパターンダイヤ§nが組まれる東横線において、特急や急行として日々駆け抜けています。都会的でシャープな§b§c#ccccccステンレスカーの走り§nをご堪能ください！☆彡",
        "candidates": ["5050専用急行"]
      },
      {
        "vehicle": "5050系Hikarie",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は特別仕様車、§b§c#ffd700東急5050系4000番台「Shibuya Hikarie号」§nです！渋谷のランドマーク『渋谷ヒカリエ』の開業1周年を記念して登場しました。通常の赤帯とは異なり、建物をイメージした§b§c#ffd700ゴールド§nを基調とする煌びやかなラッピングが施され、編成全体で§b§c#ffcc00渋谷の街の魅力§nを表現しています。広大な直通ネットワークの中でも一際目を引く§b§c#ffff00黄金の輝き§nは注目の的。多彩な顔を見せる東横線ダイヤの中で異彩を放つ§b§c#ff9900特別な姿§nをお楽しみください！☆彡",
        "candidates": ["Hikarei専用快速急行"]
      }
    ];

    let catalogList = [...standardDefaultCatalog];

    function applySelectedVehicle() {
      const select = document.getElementById("presetVehicleSelect");
      if (select.value) {
        document.getElementById("v_vehicle").value = select.value;
      }
    }

    function addSelectedCandidate() {
      const select = document.getElementById("presetCandidateSelect");
      const val = select.value;
      if (!val) return;

      const input = document.getElementById("v_candidates");
      const existing = input.value.split(",").map(s => s.trim()).filter(Boolean);
      if (!existing.includes(val)) {
        existing.push(val);
        input.value = existing.join(", ");
      }
      select.value = "";
    }

    // § トークンのパース描画処理（改行維持対応）
    function parseRemarkStyleTokens(text) {
      const segments = [];
      let currentColor = "";
      let currentBold = false;
      let currentBlink = false;
      let buffer = "";
      let index = 0;

      while (index < text.length) {
        const ch = text[index];
        if (ch === "§") {
          if (buffer) {
            segments.push({ text: buffer, color: currentColor, bold: currentBold, blink: currentBlink });
            buffer = "";
          }
          const next = text[index + 1] || "";
          if (next === "b" || next === "B") {
            currentBold = true;
            index += 2;
            continue;
          }
          if (next === "n" || next === "N") {
            currentBold = false;
            currentColor = "";
            currentBlink = false;
            index += 2;
            continue;
          }
          if (next === "c" || next === "C") {
            const colorValue = text.slice(index + 2, index + 9).trim();
            if (/^#[0-9a-fA-F]{3,8}$/.test(colorValue)) {
              currentColor = colorValue;
              index += 2 + colorValue.length;
              continue;
            }
          }
          if (next === "f" || next === "F") {
            currentBlink = true;
            index += 2;
            continue;
          }
          buffer += ch;
          index += 1;
          continue;
        }
        buffer += ch;
        index += 1;
      }
      if (buffer) {
        segments.push({ text: buffer, color: currentColor, bold: currentBold, blink: currentBlink });
      }
      return segments.length ? segments : [{ text, color: "", bold: false, blink: false }];
    }

    function updateLivePreview() {
      const textarea = document.getElementById("v_remark");
      const preview = document.getElementById("livePreview");
      preview.innerHTML = "";
      const segments = parseRemarkStyleTokens(textarea.value);

      segments.forEach(seg => {
        const span = document.createElement("span");
        span.textContent = seg.text;
        if (seg.color) span.style.color = seg.color;
        if (seg.bold) span.style.fontWeight = "900";
        if (seg.blink) {
          span.style.animation = "remark-blink 0.7s steps(2, end) infinite";
          span.style.display = "inline-block";
        }
        preview.appendChild(span);
      });
    }

    function insertAtCursor(textarea, prefix, suffix = "") {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      const replacement = prefix + selected + suffix;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.selectionStart = start + prefix.length;
      textarea.selectionEnd = start + prefix.length + selected.length;
      textarea.focus();
      updateLivePreview();
    }

    function applyFormat(type) {
      const textarea = document.getElementById("v_remark");
      if (type === 'bold') insertAtCursor(textarea, "§b");
      if (type === 'blink') insertAtCursor(textarea, "§f");
      if (type === 'reset') insertAtCursor(textarea, "§n");
    }

    function applyColor(hexColor) {
      const textarea = document.getElementById("v_remark");
      insertAtCursor(textarea, `§c${hexColor}`);
    }

    function renderList() {
      const listEl = document.getElementById("vehicleList");
      document.getElementById("itemCount").textContent = catalogList.length;
      listEl.innerHTML = "";

      catalogList.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item-card";
        
        const tagsHtml = (item.candidates || []).map(c => `
          <span class="tag">🏷️ ${c}</span>
        `).join(" ");

        div.innerHTML = `
          <div class="item-info">
            <div class="item-title">🚆 ${item.vehicle}</div>
            <div class="item-tags">${tagsHtml}</div>
            <div style="font-size:12px; color:#a8b4c2; margin-top:6px; white-space: pre-wrap;"><b>テロップ:</b> ${item.remark || "(なし)"}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-secondary" onclick="editItem(${index})">✏️ 編集</button>
            <button class="btn btn-danger" onclick="deleteItem(${index})">🗑️ 削除</button>
          </div>
        `;
        listEl.appendChild(div);
      });

      document.getElementById("jsonPreview").value = JSON.stringify(catalogList, null, 2);
    }

    function saveVehicle(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById("editIndex").value, 10);
      const vehicle = document.getElementById("v_vehicle").value.trim();
      const candidatesRaw = document.getElementById("v_candidates").value.trim();
      const remark = document.getElementById("v_remark").value;

      const candidates = candidatesRaw.split(",").map(s => s.trim()).filter(Boolean);

      const newItem = { vehicle, remark, candidates };

      if (editIdx >= 0) {
        catalogList[editIdx] = newItem;
      } else {
        catalogList.push(newItem);
      }

      resetForm();
      renderList();
    }

    function editItem(index) {
      const item = catalogList[index];
      if (!item) return;
      document.getElementById("editIndex").value = index;
      document.getElementById("v_vehicle").value = item.vehicle || "";
      document.getElementById("v_candidates").value = (item.candidates || []).join(", ");
      document.getElementById("v_remark").value = item.remark || "";
      document.getElementById("formTitle").textContent = "✏️ 車両カタログデータの編集";
      document.getElementById("saveBtn").textContent = "💾 更新を保存";
      updateLivePreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(index) {
      if (confirm(`「${catalogList[index].vehicle}」をリストから削除してもよろしいですか？`)) {
        catalogList.splice(index, 1);
        renderList();
      }
    }

    function resetForm() {
      document.getElementById("vehicleForm").reset();
      document.getElementById("editIndex").value = "-1";
      document.getElementById("formTitle").textContent = "➕ 車両カタログデータの追加 / 編集";
      document.getElementById("saveBtn").textContent = "➕ リストに追加";
      updateLivePreview();
    }

    function downloadCatalogJson() {
      const blob = new Blob([JSON.stringify(catalogList, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vehicle_catalog.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function reloadStandardCatalog() {
      if (confirm("標準の vehicle_catalog.json データに初期化・復元しますか？")) {
        catalogList = [...standardDefaultCatalog];
        renderList();
      }
    }

    function importCatalogJson(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            catalogList = parsed;
            renderList();
            alert("vehicle_catalog.json の読み込みに成功しました！");
          } else {
            alert("JSONフォーマットが正しくありません。配列形式のデータが必要です。");
          }
        } catch (err) {
          alert("JSONの解析に失敗しました。ファイル内容を確認してください。");
        }
      };
      reader.readAsText(file);
    }

    // 初回読み込み（Fetch試行 ＋ フォールバック）
    fetch("vehicle_catalog.json")
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          catalogList = data;
        }
        renderList();
      })
      .catch(() => {
        renderList();
      });

    updateLivePreview();
  </script>
</body>
