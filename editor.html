<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nゲージ 車両カタログ & 備考テロップ JSONビルダー</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&display=swap');

    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --panel-border: #30363d;
      --primary-color: #238636;
      --primary-hover: #2ea043;
      --accent-color: #58a6ff;
      --danger-color: #da3633;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --input-bg: #0d1117;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 16px 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      padding: 8px 14px;
      background: var(--panel-border);
      color: var(--text-main);
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-nav:hover { background: #484f58; }

    .notice {
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid var(--accent-color);
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }

    @media (max-width: 992px) {
      .grid-container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 16px;
      border-left: 4px solid var(--accent-color);
      padding-left: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select, textarea, input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
    }

    select:focus, textarea:focus, input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .candidate-selector-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .selected-candidates-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #0d1117;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      min-height: 42px;
      align-items: center;
    }

    .candidate-chip {
      background: #21262d;
      border: 1px solid #484f58;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      color: #c9d1d9;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .candidate-chip button {
      background: none;
      border: none;
      color: #f85149;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }

    /* Word風 書式ツールバー */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: #21262d;
      border: 1px solid var(--panel-border);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 6px 10px;
    }

    .toolbar-btn {
      padding: 4px 10px;
      background: #30363d;
      border: 1px solid #484f58;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .toolbar-btn:hover { background: #484f58; }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #30363d;
      border: 1px solid #484f58;
      border-radius: 4px;
      padding: 2px 6px;
    }

    .color-picker-wrapper input[type="color"] {
      border: none;
      width: 22px;
      height: 22px;
      cursor: pointer;
      background: none;
    }

    textarea.toolbar-textarea {
      border-radius: 0 0 6px 6px;
      white-space: pre-wrap; /* 改行対応 */
    }

    /* テロップライブプレビュー */
    .preview-box {
      background: #000;
      border: 2px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
      min-height: 48px;
      display: flex;
      align-items: center;
      overflow-x: auto;
    }

    .preview-text {
      white-space: pre-wrap; /* 改行対応 */
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    @keyframes remark-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.1; }
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary-color); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger-color); color: #fff; }
    .btn-secondary { background: #21262d; border: 1px solid var(--panel-border); color: var(--text-main); }
    .btn-secondary:hover { background: #30363d; }

    .item-list {
      max-height: 560px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: #0d1117;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      margin-right: 12px;
    }

    .item-title {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 15px;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: #21262d;
      border: 1px solid var(--panel-border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #8b949e;
      display: inline-flex;
      align-items: center;
    }

    .json-preview {
      width: 100%;
      height: 280px;
      background: #000;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #7ee787;
      font-family: monospace;
      padding: 12px;
      font-size: 12px;
      resize: vertical;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>📝 車両カタログ & 備考テロップ JSONビルダー</h1>
    <div>
      <a href="index.html" target="_blank" class="btn-nav">🚆 ディスプレイ画面を表示</a>
    </div>
  </header>

  <div class="notice">
    💡 <b>操作ガイド</b>:<br>
    ・車両名および種別候補はプルダウンから直感的に選んで追加できます。<br>
    ・下部案内テロップは改行（Enterキー）に対応しており、範囲選択してWord感覚で太字・文字色・点滅などの装飾が適用できます。
  </div>

  <div class="grid-container">
    <!-- 車両登録フォーム -->
    <div>
      <div class="card">
        <h2 id="formTitle">➕ 車両カタログデータの追加 / 編集</h2>
        <form id="vehicleForm" onsubmit="saveVehicle(event)">
          <input type="hidden" id="editIndex" value="-1">

          <!-- 車両名プルダウン選択 -->
          <div class="form-group">
            <label>車両名 (vehicle)</label>
            <div style="display:flex; gap:8px;">
              <select id="v_vehicle_select" onchange="handleVehicleSelect(this.value)">
                <option value="">-- プルダウンから車両を選択 --</option>
                <option value="103系">103系</option>
                <option value="281系">281系</option>
                <option value="5050系4000">5050系4000</option>
                <option value="5050系Hikarie">5050系Hikarie</option>
                <option value="E001系">E001系 (TRAIN SUITE 四季島)</option>
                <option value="E231系">E231系</option>
                <option value="E233系3000">E233系3000</option>
                <option value="E235系1000">E235系1000</option>
                <option value="E259系">E259系</option>
                <option value="キハ85系">キハ85系</option>
                <option value="HC85系">HC85系</option>
                <option value="209系">209系</option>
                <option value="E257系">E257系</option>
                <option value="185系">185系</option>
                <option value="__custom__">✏️ 自由入力（リストにない車種名）</option>
              </select>
            </div>
            <input type="text" id="v_vehicle_custom" placeholder="車種名を入力してください" style="margin-top:6px; display:none;">
          </div>

          <!-- 種別画像候補プルダウンピック (手動テキスト行を削除) -->
          <div class="form-group">
            <label>種別画像候補 (candidates)</label>
            <div class="candidate-selector-row">
              <select id="presetCandidateSelect">
                <option value="">-- 種別キーワード一覧から選択して追加 --</option>
                <option value="オレンジ快速.単体大">オレンジ快速.単体大</option>
                <option value="オレンジ快速.宇都宮">オレンジ快速.宇都宮</option>
                <option value="オレンジ快速.高崎">オレンジ快速.高崎</option>
                <option value="オレンジ快速.東海道">オレンジ快速.東海道</option>
                <option value="オレンジ快速アクティー.単体大">オレンジ快速アクティー.単体大</option>
                <option value="オレンジ快速アーバン.単体大">オレンジ快速アーバン.単体大</option>
                <option value="オレンジ快速ラビット.単体大">オレンジ快速ラビット.単体大</option>
                <option value="緑普通.宇都宮">緑普通.宇都宮</option>
                <option value="緑普通.高崎">緑普通.高崎</option>
                <option value="緑普通.東海道">緑普通.東海道</option>
                <option value="緑普通.横須賀">緑普通.横須賀</option>
                <option value="グレー普通.単体大">グレー普通.単体大</option>
                <option value="グレー普通.宇都宮">グレー普通.宇都宮</option>
                <option value="グレー普通.高崎">グレー普通.高崎</option>
                <option value="スカイブルー特別快速.単体大">スカイブルー特別快速.単体大</option>
                <option value="スカイブルー特別快速.宇都宮">スカイブルー特別快速.宇都宮</option>
                <option value="スカイブルー特別快速.高崎">スカイブルー特別快速.高崎</option>
                <option value="スカイブルー特別快速.東海道">スカイブルー特別快速.東海道</option>
                <option value="相鉄線">相鉄線</option>
                <option value="5050専用急行">5050専用急行</option>
                <option value="E001専用四季島">E001専用四季島</option>
                <option value="Hikarei専用快速急行">Hikarei専用快速急行</option>
                <option value="特急単体大">特急単体大</option>
              </select>
              <button type="button" class="btn btn-secondary" onclick="addSelectedPreset()">➕ 追加</button>
            </div>

            <!-- 選択済み種別候補タグリスト -->
            <div class="selected-candidates-box" id="selectedCandidatesBox">
              <!-- JSでタグ生成 -->
            </div>
          </div>

          <!-- 下部備考テロップ入力 ＋ Word風書式ツールバー (改行対応) -->
          <div class="form-group">
            <label>下部案内テロップ文 (remark: 改行Enter可)</label>

            <!-- 書式ツールバー -->
            <div class="toolbar">
              <button type="button" class="toolbar-btn" onclick="applyFormat('bold')"><b>B</b> 太字 (§b)</button>
              <button type="button" class="toolbar-btn" onclick="applyFormat('blink')">⚡ 点滅 (§f)</button>
              <div class="color-picker-wrapper">
                <span style="font-size:11px; color:#fff;">🎨 文字色:</span>
                <input type="color" id="textColorPicker" value="#ffaa00" onchange="applyColor(this.value)">
              </div>
              <button type="button" class="toolbar-btn" onclick="applyFormat('reset')">🔄 装飾リセット (§n)</button>
            </div>

            <textarea id="v_remark" class="toolbar-textarea" rows="4" placeholder="例: §c#ffaa00§b【新案内】§n 改行を含む長文テロップを
入力できます。" oninput="updateLivePreview()" required></textarea>

            <!-- リアルタイム ライブプレビュー (改行表示) -->
            <label style="margin-top: 8px;">📺 下部テロップ表示イメージ（リアルタイムプレビュー）:</label>
            <div class="preview-box">
              <div class="preview-text" id="livePreview"></div>
            </div>
          </div>

          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="saveBtn">➕ リストに追加</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 フォームリセット</button>
          </div>
        </form>
      </div>

      <!-- JSON出力カード -->
      <div class="card">
        <h2>📁 JSONファイルの書き出し (Export) / 読み込み (Import)</h2>
        <textarea id="jsonPreview" class="json-preview" readonly></textarea>
        <div class="action-bar">
          <button class="btn btn-primary" onclick="downloadCatalogJson()">💾 JSONをダウンロード (書き出し)</button>
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 既存のJSONを読み込む</button>
          <button class="btn btn-secondary" onclick="reloadStandardCatalog()">🔄 標準JSONへリセット</button>
          <input type="file" id="importFile" style="display:none" accept=".json" onchange="importCatalogJson(event)">
        </div>
      </div>
    </div>

    <!-- リスト一覧 -->
    <div>
      <div class="card">
        <h2>🚆 車両カタログ一覧 (<span id="itemCount">0</span>件)</h2>
        <div class="item-list" id="vehicleList">
          <!-- JSで動的生成 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 標準 `vehicle_catalog.json` 内データ（「成田エクスプレス15号」除去版）
    const standardDefaultCatalog = [
      {
        "vehicle": "103系",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は§b§c#ff9900中央線快速 103系§nです。\n先代の§c#cccccc101系§nの後継として登場し、駅間距離が短い通勤路線に特化した§b§c#00ffff加速性能§nを重視した設計となっています。",
        "candidates": ["オレンジ快速.単体大"]
      },
      {
        "vehicle": "E001系",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両はクルーズトレイン §b§c#b3ae92E001系「TRAIN SUITE 四季島」§nです。\n東日本各地の豊かな自然や文化を巡る上質な旅を提供するために誕生しました。",
        "candidates": ["E001専用四季島"]
      },
      {
        "vehicle": "E233系3000",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は近郊形電車 §b§c#ff8a17E233系3000番台§nです。\n伝統の湘南色帯と2階建てグリーン車が大きな特徴です。",
        "candidates": [
          "オレンジ快速.宇都宮",
          "オレンジ快速.高崎",
          "オレンジ快速.単体大",
          "オレンジ快速.東海道",
          "オレンジ快速アクティー.単体大",
          "緑普通.宇都宮",
          "緑普通.高崎",
          "緑普通.東海道"
        ]
      },
      {
        "vehicle": "E259系",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は§b§c#ff3333特急成田エクスプレス E259系§nです！\n成田空港へのアクセス特急として活躍する名車です。",
        "candidates": ["特急単体大"]
      },
      {
        "vehicle": "281系",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は§b§c#0066ff関空特急 281系「はるか」§nです。",
        "candidates": ["特急単体大"]
      },
      {
        "vehicle": "HC85系",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は§b§c#ff6600新型ハイブリッド特急 HC85系§nです。",
        "candidates": ["特急単体大"]
      },
      {
        "vehicle": "5050系4000",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は東急東横線の主力、§b§c#cccccc東急5050系4000番台§nです。",
        "candidates": ["5050専用急行"]
      },
      {
        "vehicle": "5050系Hikarie",
        "remark": "§f§b§c#ffff00【☆彡車両案内☆彡】§n 現在表示中の車両は特別仕様車、§b§c#ffd700東急5050系4000番台「Shibuya Hikarie号」§nです！",
        "candidates": ["Hikarei専用快速急行"]
      }
    ];

    let catalogList = [...standardDefaultCatalog];
    let currentCandidates = [];

    // 車両選択ハンドラー
    function handleVehicleSelect(val) {
      const customInput = document.getElementById("v_vehicle_custom");
      if (val === "__custom__") {
        customInput.style.display = "block";
        customInput.required = true;
        customInput.value = "";
        customInput.focus();
      } else {
        customInput.style.display = "none";
        customInput.required = false;
        customInput.value = "";
      }
    }

    function getSelectedVehicleValue() {
      const selectVal = document.getElementById("v_vehicle_select").value;
      if (selectVal === "__custom__") {
        return document.getElementById("v_vehicle_custom").value.trim();
      }
      return selectVal;
    }

    function setSelectedVehicleValue(val) {
      const select = document.getElementById("v_vehicle_select");
      const customInput = document.getElementById("v_vehicle_custom");
      const options = [...select.options].map(o => o.value);

      if (options.includes(val)) {
        select.value = val;
        customInput.style.display = "none";
        customInput.required = false;
      } else if (val) {
        select.value = "__custom__";
        customInput.style.display = "block";
        customInput.required = true;
        customInput.value = val;
      } else {
        select.value = "";
        customInput.style.display = "none";
        customInput.required = false;
      }
    }

    // 種別候補タグの追加・削除
    function addSelectedPreset() {
      const select = document.getElementById("presetCandidateSelect");
      const val = select.value;
      if (!val) return;

      if (!currentCandidates.includes(val)) {
        currentCandidates.push(val);
        renderCandidateChips();
      }
      select.value = "";
    }

    function removeCandidateChip(index) {
      currentCandidates.splice(index, 1);
      renderCandidateChips();
    }

    function renderCandidateChips() {
      const box = document.getElementById("selectedCandidatesBox");
      box.innerHTML = "";
      if (currentCandidates.length === 0) {
        box.innerHTML = '<span style="font-size:11px; color:#8b949e;">選択された種別候補はありません（上のプルダウンから選択）</span>';
        return;
      }

      currentCandidates.forEach((c, idx) => {
        const chip = document.createElement("div");
        chip.className = "candidate-chip";
        chip.innerHTML = `
          🏷️ ${c}
          <button type="button" onclick="removeCandidateChip(${idx})">✕</button>
        `;
        box.appendChild(chip);
      });
    }

    // § トークンのパース描画処理 (改行対応)
    function parseRemarkStyleTokens(text) {
      const segments = [];
      let currentColor = "";
      let currentBold = false;
      let currentBlink = false;
      let buffer = "";
      let index = 0;

      while (index < text.length) {
        const ch = text[index];
        if (ch === "§") {
          if (buffer) {
            segments.push({ text: buffer, color: currentColor, bold: currentBold, blink: currentBlink });
            buffer = "";
          }
          const next = text[index + 1] || "";
          if (next === "b" || next === "B") {
            currentBold = true;
            index += 2;
            continue;
          }
          if (next === "n" || next === "N") {
            currentBold = false;
            currentColor = "";
            currentBlink = false;
            index += 2;
            continue;
          }
          if (next === "c" || next === "C") {
            const colorValue = text.slice(index + 2, index + 9).trim();
            if (/^#[0-9a-fA-F]{3,8}$/.test(colorValue)) {
              currentColor = colorValue;
              index += 2 + colorValue.length;
              continue;
            }
          }
          if (next === "f" || next === "F") {
            currentBlink = true;
            index += 2;
            continue;
          }
          buffer += ch;
          index += 1;
          continue;
        }
        buffer += ch;
        index += 1;
      }
      if (buffer) {
        segments.push({ text: buffer, color: currentColor, bold: currentBold, blink: currentBlink });
      }
      return segments.length ? segments : [{ text, color: "", bold: false, blink: false }];
    }

    function updateLivePreview() {
      const textarea = document.getElementById("v_remark");
      const preview = document.getElementById("livePreview");
      preview.innerHTML = "";
      const segments = parseRemarkStyleTokens(textarea.value);

      segments.forEach(seg => {
        const span = document.createElement("span");
        span.textContent = seg.text;
        if (seg.color) span.style.color = seg.color;
        if (seg.bold) span.style.fontWeight = "900";
        if (seg.blink) {
          span.style.animation = "remark-blink 0.7s steps(2, end) infinite";
          span.style.display = "inline-block";
        }
        preview.appendChild(span);
      });
    }

    function insertAtCursor(textarea, prefix, suffix = "") {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      const replacement = prefix + selected + suffix;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.selectionStart = start + prefix.length;
      textarea.selectionEnd = start + prefix.length + selected.length;
      textarea.focus();
      updateLivePreview();
    }

    function applyFormat(type) {
      const textarea = document.getElementById("v_remark");
      if (type === 'bold') insertAtCursor(textarea, "§b");
      if (type === 'blink') insertAtCursor(textarea, "§f");
      if (type === 'reset') insertAtCursor(textarea, "§n");
    }

    function applyColor(hexColor) {
      const textarea = document.getElementById("v_remark");
      insertAtCursor(textarea, `§c${hexColor}`);
    }

    function renderList() {
      const listEl = document.getElementById("vehicleList");
      document.getElementById("itemCount").textContent = catalogList.length;
      listEl.innerHTML = "";

      catalogList.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item-card";
        
        const tagsHtml = (item.candidates || []).map(c => `
          <span class="tag">🏷️ ${c}</span>
        `).join(" ");

        div.innerHTML = `
          <div class="item-info">
            <div class="item-title">🚆 ${item.vehicle}</div>
            <div class="item-tags">${tagsHtml}</div>
            <div style="font-size:12px; color:#a8b4c2; margin-top:6px; white-space:pre-wrap;"><b>テロップ:</b> ${item.remark || "(なし)"}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-secondary" onclick="editItem(${index})">✏️ 編集</button>
            <button class="btn btn-danger" onclick="deleteItem(${index})">🗑️ 削除</button>
          </div>
        `;
        listEl.appendChild(div);
      });

      document.getElementById("jsonPreview").value = JSON.stringify(catalogList, null, 2);
    }

    function saveVehicle(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById("editIndex").value, 10);
      const vehicle = getSelectedVehicleValue();
      if (!vehicle) {
        alert("車両名を選択または入力してください。");
        return;
      }
      const remark = document.getElementById("v_remark").value;

      const newItem = {
        vehicle,
        remark,
        candidates: [...currentCandidates]
      };

      if (editIdx >= 0) {
        catalogList[editIdx] = newItem;
      } else {
        catalogList.push(newItem);
      }

      resetForm();
      renderList();
    }

    function editItem(index) {
      const item = catalogList[index];
      if (!item) return;
      document.getElementById("editIndex").value = index;
      setSelectedVehicleValue(item.vehicle || "");
      currentCandidates = [...(item.candidates || [])];
      renderCandidateChips();

      document.getElementById("v_remark").value = item.remark || "";
      document.getElementById("formTitle").textContent = "✏️ 車両カタログデータの編集";
      document.getElementById("saveBtn").textContent = "💾 更新を保存";
      updateLivePreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(index) {
      if (confirm(`「${catalogList[index].vehicle}」をリストから削除してもよろしいですか？`)) {
        catalogList.splice(index, 1);
        renderList();
      }
    }

    function resetForm() {
      document.getElementById("vehicleForm").reset();
      setSelectedVehicleValue("");
      currentCandidates = [];
      renderCandidateChips();
      document.getElementById("editIndex").value = "-1";
      document.getElementById("formTitle").textContent = "➕ 車両カタログデータの追加 / 編集";
      document.getElementById("saveBtn").textContent = "➕ リストに追加";
      updateLivePreview();
    }

    function downloadCatalogJson() {
      const blob = new Blob([JSON.stringify(catalogList, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vehicle_catalog.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function reloadStandardCatalog() {
      if (confirm("標準の vehicle_catalog.json データに初期化・復元しますか？")) {
        catalogList = JSON.parse(JSON.stringify(standardDefaultCatalog));
        renderList();
      }
    }

    function importCatalogJson(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            catalogList = parsed;
            renderList();
            alert("vehicle_catalog.json の読み込みに成功しました！");
          } else {
            alert("JSONフォーマットが正しくありません。配列形式のデータが必要です。");
          }
        } catch (err) {
          alert("JSONの解析に失敗しました。ファイル内容を確認してください。");
        }
      };
      reader.readAsText(file);
    }

    // 初回読み込み
    fetch("vehicle_catalog.json")
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          catalogList = data;
        }
        renderList();
      })
      .catch(() => {
        renderList();
      });

    renderCandidateChips();
    updateLivePreview();
  </script>
</body>
