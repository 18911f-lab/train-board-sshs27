<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>渋谷南改札口型レイアウト設定</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    body {
      display: block;
    }

    #layout-root {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .canvas {
      position: absolute;
      right: 0;
      top: 0;
      width: 60vw;
      height: 100vh;
      pointer-events: none;
    }

    .background-panel {
      position: absolute;
      right: 0;
      display: block;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: left top;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      pointer-events: none;
    }

    .status-sprite {
      position: absolute;
      display: block;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: left top;
      pointer-events: none;
      z-index: 2;
    }

    .time-digit-sprite {
      position: absolute;
      display: block;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: left top;
      pointer-events: none;
      z-index: 2;
    }

    .type-sprite {
      position: absolute;
      display: block;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: left top;
      pointer-events: none;
      z-index: 3;
    }

    .vehicle-sprite {
      position: absolute;
      display: block;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center center;
      pointer-events: none;
      z-index: 4;
    }

    .remark-sprite {
      position: absolute;
      display: block;
      overflow: hidden;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 5;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.8cm;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .remark-text {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      display: inline-block;
      min-width: max-content;
      will-change: transform;
      user-select: none;
      font-size: 0.8cm;
      color: #fff;
    }

    @keyframes remark-scroll {
      from {
        transform: translateX(0) translateY(-50%);
      }
      to {
        transform: translateX(-50%) translateY(-50%);
      }
    }

    @keyframes remark-blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0.1;
      }
    }

    .background-panel.top {
      top: 0;
    }

    .background-panel.bottom {
      bottom: 0;
    }

    .control-panel {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 12px;
      padding: 12px 10px;
      box-sizing: border-box;
      background: #16181b;
      border-right: 2px solid #2e343d;
      box-shadow: 2px 0 10px rgba(0,0,0,0.8);
      z-index: 50;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .control-panel.collapsed {
      transform: translateX(-100%);
    }

    /* パネルが閉じているときに画面左端に常駐する「設定を開く」ボタン */
    .panel-open-floating-btn {
      position: fixed;
      top: 12px;
      left: 0;
      padding: 7px 12px;
      background: #1c2026;
      border: 1px solid #4a5568;
      border-left: none;
      border-radius: 0 4px 4px 0;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 3px 2px 12px rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
      align-items: center;
      gap: 5px;
      user-select: none;
      letter-spacing: 0.04em;
    }
    .panel-open-floating-btn:hover {
      background: #2b323c;
      color: #fff;
      border-color: #63b3ed;
    }
    .panel-open-floating-btn:active {
      background: #15181d;
    }
    .panel-open-floating-btn.visible {
      display: flex !important;
    }

    /* カスタムスクロールバー */
    .control-panel::-webkit-scrollbar {
      width: 4px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: #333a42;
    }

    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a3038;
      padding: 2px 0 4px 0;
      margin-bottom: 2px;
    }

    .panel-header-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #9daec2;
      text-align: center;
      flex: 1;
    }

    .panel-close-icon-btn {
      background: transparent;
      border: none;
      color: #6c7a8a;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .panel-close-icon-btn:hover {
      color: #fff;
    }

    .global-controls {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 6px;
      padding: 8px;
      background: #1c1f24;
      border: 1px solid #2d333b;
    }

    .global-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
    }

    .global-row label {
      min-width: 60px;
      color: #a8b4c2;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .global-row input {
      width: 65px;
      padding: 3px 5px;
      border-radius: 0;
      border: 1px solid #3d4652;
      background: #0d0e10;
      color: #e2e8f0;
      font-size: 11px;
      font-family: monospace;
      text-align: right;
    }

    .reset-button {
      width: 100%;
      padding: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: #252a30;
      border: 1px solid #3d4550;
      color: #cfd8e3;
      cursor: pointer;
      margin-top: 4px;
    }
    .reset-button:hover {
      background: #303740;
      color: #fff;
    }
    .reset-button:active {
      background: #1a1e22;
    }

    .track-input {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 7px;
      background: #1c1f24;
      border: 1px solid #2d333b;
      box-sizing: border-box;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .track-label {
      width: 48px;
      min-width: 48px;
      color: #e2e8f0;
      font-weight: 700;
      font-size: 11px;
      text-align: center;
      flex-shrink: 0;
      padding: 3px 0;
      border: 1px solid #3b434d;
      background: #131518;
      box-sizing: border-box;
      letter-spacing: 0.02em;
    }

    select {
      flex: 1;
      min-width: 0;
      width: auto;
      font-size: 11px;
      padding: 3px 4px;
      border-radius: 0;
      border: 1px solid #3d4652;
      background: #0d0e10;
      color: #e2e8f0;
    }

    select option {
      background: #1a1d20;
      color: #fff;
    }

    .status-group {
      display: flex;
      gap: 3px;
      width: 100%;
    }

    .status-group button {
      flex: 1;
      padding: 4px 0;
      font-size: 11px;
      font-weight: 600;
      border-radius: 0;
      border: 1px solid #333a44;
      background: #1a1e22;
      color: #8c9ba9;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    .status-group button:hover {
      background: #23282e;
      color: #cbd5e1;
    }

    /* 状態ボタンのアクティブ色（渋い鉄道機器風） */
    .status-group button.active {
      font-weight: 700;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.6);
    }
    .status-group button:nth-child(1).active {
      background: #143520;
      border-color: #276749;
      color: #68d391; /* 運転: 深緑 */
    }
    .status-group button:nth-child(2).active {
      background: #3d2f0a;
      border-color: #744210;
      color: #f6e05e; /* 点検: 渋黄 */
    }
    .status-group button:nth-child(3).active {
      background: #3f1515;
      border-color: #7b2424;
      color: #fc8181; /* 抑止: 渋赤 */
    }
    .status-group button:nth-child(4).active {
      background: #25282c;
      border-color: #4a5568;
      color: #e2e8f0; /* 終了: 鈍炭色 */
    }

    .mode-toggle-group {
      display: flex;
      gap: 4px;
      margin-bottom: 2px;
      width: 100%;
    }

    .mode-toggle-group button {
      flex: 1;
      padding: 5px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: #181b1f;
      border: 1px solid #333a44;
      color: #8c9ba9;
      cursor: pointer;
    }

    .mode-toggle-group button.active {
      background: #1b2e4b;
      border-color: #2b6cb0;
      color: #bee3f8;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }

    .time-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .time-input-group label {
      color: #8c98a5;
      font-size: 11px;
      font-weight: 600;
      min-width: 52px;
    }

    .time-input-group input[type="time"] {
      flex: 1;
      padding: 2px 4px;
      border: 1px solid #3d4652;
      background: #0d0e10;
      color: #e2e8f0;
      font-size: 11px;
      font-family: monospace;
    }

    .schedule-controls {
      display: none;
      flex-direction: column;
      gap: 5px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid #2a3038;
    }

    .schedule-controls.visible {
      display: flex;
    }

    .schedule-controls button {
      width: 100%;
      padding: 4px 3px;
      font-size: 11px;
      font-weight: 600;
      background: #20242a;
      border: 1px solid #353d47;
      color: #b5c0cd;
      cursor: pointer;
    }
    .schedule-controls button:hover {
      background: #2a3038;
      color: #fff;
    }

    .schedule-clock-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }
    .schedule-clock-row label {
      font-size: 11px;
      color: #8c98a5;
      white-space: nowrap;
    }
    .schedule-clock-row input[type="time"] {
      flex: 1;
      padding: 2px 4px;
      font-size: 11px;
      border: 1px solid #3d4652;
      background: #0d0e10;
      color: #e2e8f0;
      font-family: monospace;
    }

    .schedule-status {
      width: 100%;
      color: #a4b3c4;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      margin-top: 4px;
      word-break: break-all;
    }

    .schedule-status.error {
      color: #feb2b2;
    }

    .no-schedule-label {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.7);
      font: 700 12px sans-serif;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="layout-root"></div>

  <script src="schedule.js"></script>
  <script>
    const REMARK_SCROLL_CONFIG = {
      durationSeconds: 75,
      fadeInStartRatio: 0.0,
      fadeOutStartRatio: 1.0,
      travelDistancePaddingRatio: 0.5
    };

    let currentStation = null;
    let SERIES_NAME = "渋谷南改札口型";
    let panelWidth = 0;
    let panelHeight = 0;

    const ratio = (value, total) => total === 0 ? 0 : value / total;
    const encodeAssetUrl = (asset) => encodeURI(asset);
    const formatSystemTime = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    };

    const resolveExistingAssetUrl = async (candidates) => {
      const uniqueCandidates = [...new Set((candidates || []).filter(Boolean))];
      for (const candidate of uniqueCandidates) {
        const img = new Image();
        const loaded = await new Promise((resolve) => {
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = candidate;
        });
        if (loaded) {
          return candidate;
        }
      }
      return uniqueCandidates[0] || "";
    };

    const root = document.getElementById("layout-root");
    const topPanel = document.createElement("div");
    topPanel.className = "background-panel top";
    topPanel.style.left = "auto";
    topPanel.style.right = "0";
    topPanel.style.top = "0";
    root.appendChild(topPanel);

    const bottomPanel = document.createElement("div");
    bottomPanel.className = "background-panel bottom";
    bottomPanel.style.left = "auto";
    bottomPanel.style.right = "0";
    bottomPanel.style.bottom = "0";
    root.appendChild(bottomPanel);

    const controlPanel = document.createElement("div");
    controlPanel.className = "control-panel";

    // パネルが閉じているときに画面左端に表示される「開く」ボタン
    const panelOpenBtn = document.createElement("button");
    panelOpenBtn.type = "button";
    panelOpenBtn.className = "panel-open-floating-btn";
    panelOpenBtn.innerHTML = "⚙ 画面設定を開く ▶";
    document.body.appendChild(panelOpenBtn);

    const setPanelCollapsed = (isCollapsed) => {
      controlPanel.classList.toggle("collapsed", isCollapsed);
      panelOpenBtn.classList.toggle("visible", isCollapsed);
    };

    panelOpenBtn.addEventListener("click", () => {
      setPanelCollapsed(false);
    });

    // ヘッダー行
    const panelHeaderRow = document.createElement("div");
    panelHeaderRow.className = "panel-header-row";

    const panelHeader = document.createElement("div");
    panelHeader.className = "panel-header-title";
    panelHeader.textContent = "【 画面設定 】";

    const panelCloseBtn = document.createElement("button");
    panelCloseBtn.type = "button";
    panelCloseBtn.className = "panel-close-icon-btn";
    panelCloseBtn.textContent = "◀ 閉じる";
    panelCloseBtn.addEventListener("click", () => {
      setPanelCollapsed(true);
    });

    panelHeaderRow.appendChild(panelHeader);
    panelHeaderRow.appendChild(panelCloseBtn);
    controlPanel.appendChild(panelHeaderRow);

    const globalVariantState = {
      currentVariant: "en",
      currentMode: "live", // "live" (実況) または "schedule" (予定)
      jpSeconds: 3,
      enSeconds: 3,
      timeoutId: null
    };

    const updateBackgroundPanels = () => {
      if (!currentStation) return;
      const mode = globalVariantState.currentMode || "live";
      const upperBg = currentStation.panels?.upper?.backgrounds?.[mode] || currentStation.panels?.upper?.backgrounds?.default;
      const lowerBg = currentStation.panels?.lower?.backgrounds?.[mode] || currentStation.panels?.lower?.backgrounds?.default;

      if (upperBg) {
        resolveExistingAssetUrl([upperBg]).then((asset) => {
          if (asset) topPanel.style.backgroundImage = `url('${encodeAssetUrl(asset)}')`;
        });
      }
      if (lowerBg) {
        resolveExistingAssetUrl([lowerBg]).then((asset) => {
          if (asset) bottomPanel.style.backgroundImage = `url('${encodeAssetUrl(asset)}')`;
        });
      }
    };

    const applyStationLayout = (station) => {
      currentStation = station;
      SERIES_NAME = station.seriesName || station.name || "渋谷南改札口型";

      const upperWidth = station.panels?.upper?.widthCm || 33.64;
      const upperHeight = station.panels?.upper?.heightCm || 8.45;
      const lowerHeight = station.panels?.lower?.heightCm || 8.45;
      const sceneWidthCm = upperWidth;
      const sceneHeightCm = upperHeight + lowerHeight;

      const scale = Math.min(
        window.innerHeight / sceneHeightCm,
        window.innerWidth / sceneWidthCm
      );

      panelWidth = sceneWidthCm * scale * 0.9;
      panelHeight = upperHeight * scale * 0.9;

      topPanel.style.width = `${panelWidth}px`;
      topPanel.style.height = `${panelHeight}px`;
      topPanel.style.backgroundSize = "100% 100%";

      bottomPanel.style.width = `${panelWidth}px`;
      bottomPanel.style.height = `${panelHeight}px`;
      bottomPanel.style.backgroundSize = "100% 100%";

      updateBackgroundPanels();
    };

    const setDisplayMode = (mode) => {
      globalVariantState.currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      document.querySelectorAll(".status-group").forEach((el) => {
        el.style.display = mode === "live" ? "flex" : "none";
      });
      document.querySelectorAll(".time-input-group").forEach((el) => {
        el.style.display = mode === "schedule" ? "flex" : "none";
      });
      scheduleControls?.classList.toggle("visible", mode === "schedule");
      
      // 背景画像の差し替え
      updateBackgroundPanels();

      // 描画ロジック
      if (mode === "live") {
        document.querySelectorAll(".time-digit-sprite").forEach((el) => el.remove());
        document.querySelectorAll(".no-schedule-label").forEach((el) => el.remove());
        renderStatusSprites();
      } else {
        document.querySelectorAll(".status-sprite").forEach((el) => el.remove());
        renderTimeSprites();
        renderNoScheduleLabels();
      }
    };

    const applyGlobalVariantToAllTracks = (variant) => {
      globalVariantState.currentVariant = variant;
      trackList.forEach((trackNo) => {
        if (trackState[trackNo]) {
          trackState[trackNo].variant = variant;
        }
      });
      renderVehicleSprites();
      renderTypeSprites();
    };

    const scheduleVariantCycle = () => {
      if (globalVariantState.timeoutId) {
        clearTimeout(globalVariantState.timeoutId);
      }

      const nextVariant = globalVariantState.currentVariant === "jp" ? "en" : "jp";
      const nextDurationMs = (nextVariant === "jp" ? globalVariantState.jpSeconds : globalVariantState.enSeconds) * 1000;

      globalVariantState.timeoutId = setTimeout(() => {
        applyGlobalVariantToAllTracks(nextVariant);
        scheduleVariantCycle();
      }, nextDurationMs);
    };

    const resetRandomizedVehicleType = () => {
      trackList.forEach((trackNo) => {
        if (!trackState[trackNo]) return;

        trackState[trackNo].type = resolveVehicleType(trackState[trackNo].vehicle);
        const typeAssets = resolveTypeAssets(trackState[trackNo].type);
        trackState[trackNo].typeJpn = typeAssets.jpn;
        trackState[trackNo].typeEn = typeAssets.en;
      });

      renderTypeSprites();
    };

    const globalControls = document.createElement("div");
    globalControls.className = "global-controls";
    const trackSelects = new Map();
    const scheduleUi = { timeInputs: new Map(), status: null, clockInput: null, systemClock: true, autoUpdate: true, ready: false };

    const scheduleControls = document.createElement("div");
    scheduleControls.className = "schedule-controls";

    const scheduleFileInput = document.createElement("input");
    scheduleFileInput.type = "file";
    scheduleFileInput.accept = ".json,application/json";
    scheduleFileInput.hidden = true;
    const scheduleLoadButton = document.createElement("button");
    scheduleLoadButton.type = "button";
    scheduleLoadButton.textContent = "時刻表読込 (JSON)";
    scheduleLoadButton.addEventListener("click", () => scheduleFileInput.click());
    scheduleFileInput.addEventListener("change", () => loadScheduleFile(scheduleFileInput.files?.[0]));

    const scheduleExportButton = document.createElement("button");
    scheduleExportButton.type = "button";
    scheduleExportButton.textContent = "時刻表エクスポート";
    scheduleExportButton.addEventListener("click", () => exportCurrentSchedule());

    const scheduleResetButton = document.createElement("button");
    scheduleResetButton.type = "button";
    scheduleResetButton.textContent = "リセット (初期値)";
    scheduleResetButton.addEventListener("click", () => resetScheduleToRaw());

    const clockRow = document.createElement("div");
    clockRow.className = "schedule-clock-row";
    const clockLabel = document.createElement("label");
    clockLabel.textContent = "基準時刻:";
    const clockInput = document.createElement("input");
    clockInput.type = "time";
    clockInput.addEventListener("input", () => {
      if (clockInput.value) {
        scheduleUi.systemClock = false;
        refreshScheduleDisplay();
      }
    });
    scheduleUi.clockInput = clockInput;
    const systemClockButton = document.createElement("button");
    systemClockButton.type = "button";
    systemClockButton.style.width = "auto";
    systemClockButton.style.padding = "2px 6px";
    systemClockButton.textContent = "PC時刻";
    systemClockButton.addEventListener("click", () => {
      scheduleUi.systemClock = true;
      refreshScheduleDisplay();
    });
    clockRow.append(clockLabel, clockInput, systemClockButton);

    const scheduleRefreshButton = document.createElement("button");
    scheduleRefreshButton.type = "button";
    scheduleRefreshButton.textContent = "即時更新";
    scheduleRefreshButton.addEventListener("click", () => refreshScheduleDisplay());

    const autoUpdateLabel = document.createElement("label");
    autoUpdateLabel.style.fontSize = "11px";
    autoUpdateLabel.style.color = "#a8b4c2";
    const autoUpdateCheckbox = document.createElement("input");
    autoUpdateCheckbox.type = "checkbox";
    autoUpdateCheckbox.checked = true;
    autoUpdateCheckbox.addEventListener("change", () => { scheduleUi.autoUpdate = autoUpdateCheckbox.checked; });
    autoUpdateLabel.append(autoUpdateCheckbox, " 自動更新");

    const scheduleStatus = document.createElement("div");
    scheduleStatus.className = "schedule-status";
    scheduleStatus.textContent = "）";
    scheduleUi.status = scheduleStatus;
    scheduleControls.append(scheduleFileInput, scheduleLoadButton, scheduleExportButton, scheduleResetButton, clockRow, scheduleRefreshButton, autoUpdateLabel, scheduleStatus);

    const jpRow = document.createElement("div");
    jpRow.className = "global-row";
    const jpLabel = document.createElement("label");
    jpLabel.textContent = "和文(秒)";
    const jpInput = document.createElement("input");
    jpInput.type = "number";
    jpInput.min = "0.1";
    jpInput.step = "0.1";
    jpInput.value = String(globalVariantState.jpSeconds);
    jpInput.addEventListener("input", () => {
      const value = Number(jpInput.value);
      globalVariantState.jpSeconds = Number.isFinite(value) && value > 0 ? value : 0.1;
      jpInput.value = String(globalVariantState.jpSeconds);
      scheduleVariantCycle();
    });
    jpRow.appendChild(jpLabel);
    jpRow.appendChild(jpInput);

    const enRow = document.createElement("div");
    enRow.className = "global-row";
    const enLabel = document.createElement("label");
    enLabel.textContent = "英文(秒)";
    const enInput = document.createElement("input");

    const parseRemarkStyleTokens = (text) => {
      const segments = [];
      let currentColor = "";
      let currentBold = false;
      let currentBlink = false;
      let buffer = "";
      let index = 0;

      while (index < text.length) {
        const ch = text[index];

        if (ch === "§") {
          if (buffer) {
            segments.push({ text: buffer, color: currentColor, bold: currentBold, blink: currentBlink });
            buffer = "";
          }

          const next = text[index + 1] || "";
          if (next === "b" || next === "B") {
            currentBold = true;
            index += 2;
            continue;
          }
          if (next === "n" || next === "N") {
            currentBold = false;
            currentColor = "";
            currentBlink = false;
            index += 2;
            continue;
          }
          if (next === "c" || next === "C") {
            const colorValue = text.slice(index + 2, index + 9).trim();
            if (/^#[0-9a-fA-F]{3,8}$/.test(colorValue)) {
              currentColor = colorValue;
              index += 2 + colorValue.length;
              continue;
            }
          }
          if (next === "f" || next === "F") {
            currentBlink = true;
            index += 2;
            continue;
          }

          buffer += ch;
          index += 1;
          continue;
        }

        buffer += ch;
        index += 1;
      }

      if (buffer) {
        segments.push({ text: buffer, color: currentColor, bold: currentBold, blink: currentBlink });
      }

      return segments.length ? segments : [{ text, color: "", bold: false, blink: false }];
    };

            transform: translateX(-${distancePx}px) translateY(-50%);
          }
        }
      `;
      document.head.appendChild(style);
      return { name, durationSeconds };

        const text = document.createElement("div");

        const renderSegments = (sourceText) => {
          const segments = parseRemarkStyleTokens(sourceText);

            const span = document.createElement("span");

    };

    const renderTimeSprites = () => {
      document.querySelectorAll(".time-digit-sprite").forEach((el) => el.remove());
      if (globalVariantState.currentMode !== "schedule" || !currentStation) return;

      const bgWidth = currentStation.panels?.upper?.widthCm || 33.64;
      const bgHeight = currentStation.panels?.upper?.heightCm || 8.45;

      trackList.forEach((trackNo) => {
        const track = trackState[trackNo];
        const trackDef = currentStation.tracks?.find((t) => t.trackNo === trackNo);
        if (!track || !trackDef) return;
        if (globalVariantState.currentMode === "schedule" && track.scheduleEmpty) return;

        const timeDigits = trackDef.positions?.timeDigits;
        if (!timeDigits) return;

        const panel = trackDef.panel === "upper" ? topPanel : bottomPanel;
        const timeStr = String(track.time || "10:00").trim();
        const parts = timeStr.split(":");
        const hh = (parts[0] || "10").padStart(2, "0");
        const mm = (parts[1] || "00").padStart(2, "0");

        const digits = [
          { key: "h1", char: hh[0] },
          { key: "h2", char: hh[1] },
          { key: "colon", char: ":" },
          { key: "m1", char: mm[0] },
          { key: "m2", char: mm[1] }
        ];

        digits.forEach(({ key, char }) => {
          const digitPos = timeDigits[key];
          if (!digitPos) return;

          const sprite = document.createElement("div");
          sprite.className = "time-digit-sprite";

          const xRatio = digitPos.x / bgWidth;
          const yRatio = digitPos.y / bgHeight;
          const widthCm = digitPos.widthCm || (char === ":" ? 0.2 : 0.56);
          const heightCm = digitPos.heightCm || (char === ":" ? 0.52 : 0.8);
          const widthRatio = widthCm / bgWidth;
          const heightRatio = heightCm / bgHeight;

          sprite.style.left = `${xRatio * panelWidth}px`;
          sprite.style.top = `${yRatio * panelHeight}px`;
          sprite.style.width = `${widthRatio * panelWidth}px`;
          sprite.style.height = `${heightRatio * panelHeight}px`;

          const assetCandidates = resolveTimeDigitAsset(char);
          resolveExistingAssetUrl(assetCandidates).then((asset) => {
            if (asset) sprite.style.backgroundImage = `url('${encodeAssetUrl(asset)}')`;
          });

          panel.appendChild(sprite);
        });
      });
    };

    const renderNoScheduleLabels = () => {
      document.querySelectorAll(".no-schedule-label").forEach((el) => el.remove());
      if (globalVariantState.currentMode !== "schedule" || !window.ScheduleStore?.state.current || !currentStation) return;

      const bgWidth = currentStation.panels?.upper?.widthCm || 33.64;
      const bgHeight = currentStation.panels?.upper?.heightCm || 8.45;
      trackList.forEach((trackNo) => {
        const track = trackState[trackNo];
        const trackDef = currentStation.tracks?.find((item) => item.trackNo === trackNo);
        const position = trackDef?.positions?.timeDigits?.h1;
        if (!track?.scheduleEmpty || !position) return;
        const panel = trackDef.panel === "upper" ? topPanel : bottomPanel;
        const label = document.createElement("div");
        label.className = "no-schedule-label";
        label.textContent = track.noScheduleMessage || "予定なし";
        label.style.left = `${(position.x / bgWidth) * panelWidth}px`;
        label.style.top = `${(position.y / bgHeight) * panelHeight}px`;
        label.style.width = `${(3.4 / bgWidth) * panelWidth}px`;
        label.style.height = `${(1.0 / bgHeight) * panelHeight}px`;
        panel.appendChild(label);
      });
    };

    const renderTypeSprites = () => {
      document.querySelectorAll(".type-sprite").forEach((el) => el.remove());
      if (!currentStation) return;

      const bgWidth = currentStation.panels?.upper?.widthCm || 33.64;
      const bgHeight = currentStation.panels?.upper?.heightCm || 8.45;

      trackList.forEach((trackNo) => {
        const track = trackState[trackNo];
        const trackDef = currentStation.tracks?.find((t) => t.trackNo === trackNo);
        if (!track || !trackDef) return;
        if (globalVariantState.currentMode === "schedule" && track.scheduleEmpty) return;

        const variant = track.variant || globalVariantState.currentVariant || "en";
        const assetCandidates = Array.isArray(variant === "jp" ? track.typeJpn : track.typeEn)
          ? (variant === "jp" ? track.typeJpn : track.typeEn)
          : [(variant === "jp" ? track.typeJpn : track.typeEn)];
        if (!assetCandidates.length || !assetCandidates.some(Boolean)) return;

        const panel = trackDef.panel === "upper" ? topPanel : bottomPanel;
        const sprite = document.createElement("div");
        sprite.className = "type-sprite";

        const size = resolveTypeSpriteSize(track.type);
        const offset = resolveTypeDisplayOffset(track.type);

        // 特殊種別の番線別座標オーバーライド確認
        let typePos = trackDef.positions?.type;
        const matchedRule = currentStation.specialOverrides?.typeRules?.find((r) => track.type?.includes(r.pattern));
        if (matchedRule?.trackPositions?.[trackNo]) {
          typePos = matchedRule.trackPositions[trackNo];
        }

        if (!typePos) return;

        const xRatio = typePos.x / bgWidth;
        const yRatio = (typePos.y + offset.yCm) / bgHeight;
        const widthRatio = size.widthCm / bgWidth;
        const heightRatio = size.heightCm / bgHeight;

        sprite.style.left = `${xRatio * panelWidth}px`;
        sprite.style.top = `${yRatio * panelHeight}px`;
        sprite.style.width = `${widthRatio * panelWidth}px`;
        sprite.style.height = `${heightRatio * panelHeight}px`;

        resolveExistingAssetUrl(assetCandidates).then((asset) => {
          if (asset) sprite.style.backgroundImage = `url('${encodeAssetUrl(asset)}')`;
        });

        panel.appendChild(sprite);
      });
    };

    const renderAllSprites = () => {
      renderStatusSprites();
      renderTimeSprites();
      renderNoScheduleLabels();
      renderTypeSprites();
      renderVehicleSprites();
      renderRemarkSprites();
    };

    const applyVehicleToTrack = (trackNo, vehicleName, { render = true } = {}) => {
      const track = trackState[trackNo];
      if (!track || !vehicleName || !vehicleList.includes(vehicleName)) return false;
      track.vehicle = vehicleName;
      track.type = resolveVehicleType(vehicleName);
      track.remark = resolveVehicleRemark(vehicleName);
      const vehicleAssets = resolveVehicleAssets(vehicleName);
      track.vehicleJpn = vehicleAssets.jpn;
      track.vehicleEn = vehicleAssets.en;
      const typeAssets = resolveTypeAssets(track.type);
      track.typeJpn = typeAssets.jpn;
      track.typeEn = typeAssets.en;
      const select = trackSelects.get(trackNo);
      if (select) select.value = vehicleName;
      if (render) renderAllSprites();
      return true;
    };

    const activeScheduleTime = () => scheduleUi.systemClock ? formatSystemTime() : (scheduleUi.clockInput?.value || formatSystemTime());

    const setScheduleStatus = (message, isError = false) => {
      if (!scheduleUi.status) return;
      scheduleUi.status.textContent = message;
      scheduleUi.status.classList.toggle("error", isError);
    };

    const refreshScheduleDisplay = () => {
      const now = activeScheduleTime();
      if (!now) return;

      if (scheduleUi.clockInput && scheduleUi.systemClock) {
        scheduleUi.clockInput.value = now;
      }

      const store = window.ScheduleStore;
      if (store?.state.current) {
        // 時刻表JSONが読み込まれている場合の同期処理
        trackList.forEach((trackNo) => {
          const track = trackState[trackNo];
          const event = store.getNextEvent(trackNo, now);
          const input = scheduleUi.timeInputs.get(trackNo);
          if (event) {
            track.scheduleEventId = event.id;
            track.scheduleEmpty = false;
            track.time = event.time;
            if (input) input.value = event.time;
            if (event.vehicle) applyVehicleToTrack(trackNo, event.vehicle, { render: false });
            window.dispatchEvent(new CustomEvent("schedule:displaychange", { detail: { trackNo, event, now } }));
          } else {
            track.scheduleEventId = null;
            track.scheduleEmpty = true;
            track.noScheduleMessage = store.state.current.tracks.find((item) => Number(item.trackNo) === trackNo)?.noSchedule?.message || "予定なし";
            track.time = "";
            if (input) input.value = "";
            window.dispatchEvent(new CustomEvent("schedule:empty", { detail: { trackNo, message: track.noScheduleMessage, now } }));
          }
        });
        const syncLabel = scheduleUi.systemClock ? "PC時刻同期" : "手動指定";
        setScheduleStatus(`${store.state.loadedFileName || "時刻表"} 運用中（${syncLabel} ${now}）`);
      } else {
        // 時刻表JSON未読み込み時の手動/PC時刻運用
        if (scheduleUi.systemClock) {
          // PC時刻同期が有効な場合、全番線の発車時刻を現在時刻に同期
          trackList.forEach((trackNo) => {
            const track = trackState[trackNo];
            if (track) {
              track.time = now;
              track.scheduleEmpty = false;
              const input = scheduleUi.timeInputs.get(trackNo);
              if (input) input.value = now;
            }
          });
        }
        const syncLabel = scheduleUi.systemClock ? "PC時刻に連動中" : "手動時刻指定中";
        setScheduleStatus(`基準時刻: ${now}（${syncLabel}）`);
      }

      if (globalVariantState.currentMode === "schedule") {
        renderTimeSprites();
        renderNoScheduleLabels();
      }
    };

    const scheduleContext = () => ({
      stationId: currentStation?.id,
      trackNumbers: currentStation?.tracks?.map((track) => track.trackNo) || trackList,
      vehicleNames: vehicleList
    });

    const loadScheduleFile = async (file) => {
      if (!file || !scheduleUi.ready) return;
      try {
        const document = JSON.parse(await file.text());
        const result = window.ScheduleStore.load(document, scheduleContext(), file.name);
        if (result.errors.length) {
          setScheduleStatus(result.errors.join(" "), true);
          return;
        }
        setDisplayMode("schedule");
        refreshScheduleDisplay();
      } catch (error) {
        setScheduleStatus(`時刻表JSONを読み込めませんでした: ${error.message}`, true);
      } finally {
        scheduleFileInput.value = "";
      }
    };

    const resetScheduleToRaw = () => {
      if (!window.ScheduleStore.reset()) {
        setScheduleStatus("復元するraw時刻表がありません。", true);
        return;
      }
      refreshScheduleDisplay();
    };

    const exportCurrentSchedule = () => {
      const current = window.ScheduleStore?.state.current;
      if (!current) {
        setScheduleStatus("書き出す時刻表がありません。", true);
        return;
      }
      const blob = new Blob([JSON.stringify(current, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = window.ScheduleStore.state.loadedFileName || "train-board-schedule.json";
      anchor.click();
      URL.revokeObjectURL(url);
    };

    // 初期化ロード (station_types.json と vehicle_catalog.json を非同期読込)
    Promise.all([
      fetch("station_types.json").then((r) => r.json()),
      fetch("vehicle_catalog.json").then((r) => r.json())
    ])
      .then(([stations, catalog]) => {
        catalog.forEach((item) => {
          vehicleCatalog.push(item);
          vehicleList.push(item.vehicle);
        });

        // 最初の駅型（01: 渋谷南改札型）を適用
        const station = stations[0];
        applyStationLayout(station);

        trackList.forEach((trackNo) => {
          const currentVehicle = trackState[trackNo]?.vehicle || vehicleList[0];
          trackState[trackNo].vehicle = currentVehicle;
          trackState[trackNo].remark = resolveVehicleRemark(currentVehicle);
          const vehicleAssets = resolveVehicleAssets(currentVehicle);
          trackState[trackNo].vehicleJpn = vehicleAssets.jpn;
          trackState[trackNo].vehicleEn = vehicleAssets.en;
          trackState[trackNo].type = resolveVehicleType(currentVehicle);
          const typeAssets = resolveTypeAssets(trackState[trackNo].type);
          trackState[trackNo].typeJpn = typeAssets.jpn;
          trackState[trackNo].typeEn = typeAssets.en;
        });

        const selects = document.querySelectorAll("select");
        selects.forEach((selectEl) => {
          vehicleList.forEach((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            selectEl.appendChild(option);
          });
          if (vehicleList.length > 0) {
            selectEl.value = vehicleList[0];
          }
        });

        scheduleUi.ready = true;
        refreshScheduleDisplay();
        renderAllSprites();
      })
      .catch((error) => {
        console.error("データの読み込みに失敗しました", error);
      });

    controlPanel.appendChild(globalControls);
    root.appendChild(controlPanel);

    trackList.forEach((trackNo) => {
      const track = trackState[trackNo];
      if (track) {
        track.variant = globalVariantState.currentVariant;
      }
    });

    scheduleVariantCycle();

    // 基準時刻の初期化
    if (scheduleUi.clockInput) {
      scheduleUi.clockInput.value = formatSystemTime();
    }

    // 1秒ごとの定期タイマー（時計更新および自動同期）
    setInterval(() => {
      const now = formatSystemTime();
      if (scheduleUi.systemClock && scheduleUi.clockInput && scheduleUi.clockInput.value !== now) {
        scheduleUi.clockInput.value = now;
      }
      if (scheduleUi.autoUpdate && scheduleUi.systemClock) {
        refreshScheduleDisplay();
      }
    }, 1000);

    window.trackState = trackState;
    window.vehicleCatalog = vehicleCatalog;
  </script>
</body>
</html>
