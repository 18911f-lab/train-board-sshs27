<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nゲージ 運行情報・在線表示システム</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --card-bg: #21262d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-blue: #1f6feb;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Meiryo", sans-serif;
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-info {
      font-size: 13px;
      color: var(--text-muted);
    }

    .board-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      justify-content: center;
    }

    .track-row {
      display: flex;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      gap: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .track-badge {
      font-size: 18px;
      font-weight: 800;
      background: #1f6feb;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      min-width: 75px;
      text-align: center;
      box-shadow: 0 0 10px rgba(31, 111, 235, 0.4);
    }

    .led-slot {
      height: 48px;
      background: #000;
      border: 1px solid #484f58;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slot-type { width: 140px; }
    .slot-dest { width: 150px; }
    .slot-cars { width: 85px; }

    .led-slot img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .led-fallback-text {
      color: #ffab70;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .status-badge {
      min-width: 105px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      border-radius: 6px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .st-running {
      background: #238636;
      color: #ffffff;
      border: 1px solid #3fb950;
      box-shadow: 0 0 8px rgba(63, 185, 80, 0.4);
    }

    .st-stopped {
      background: #d29922;
      color: #0d1117;
      border: 1px solid #e3b341;
      box-shadow: 0 0 8px rgba(227, 179, 65, 0.4);
    }

    .st-adjusting {
      background: #bd561d;
      color: #ffffff;
      border: 1px solid #f0883e;
      box-shadow: 0 0 8px rgba(240, 136, 62, 0.4);
    }

    .st-suspended {
      background: #da3633;
      color: #ffffff;
      border: 1px solid #f85149;
      box-shadow: 0 0 8px rgba(248, 81, 73, 0.4);
    }

    .train-select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
      flex-grow: 1;
      max-width: 280px;
    }

    .train-select:focus {
      border-color: #58a6ff;
    }

    .status-btn-group {
      display: flex;
      gap: 5px;
    }

    .btn-status {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #21262d;
      color: var(--text-main);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-status:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    .btn-status.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #fff;
    }

    /* 下部スクロールテロップ */
    .telop-container {
      background: #000;
      border: 2px solid #ff9900;
      border-radius: 6px;
      height: 52px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      box-shadow: inset 0 0 12px rgba(255, 153, 0, 0.3);
      margin-top: 8px;
    }

    .telop-text {
      position: absolute;
      white-space: nowrap;
      font-size: 18px;
      font-weight: bold;
      color: #ffaa00;
      text-shadow: 0 0 6px #ff9900;
      will-change: transform;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <span>🚆 N-Gauge 運行管理・在線情報ディスプレイ</span>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <!-- 型切り替えセレクター -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="modelSelect" style="font-size: 13px; font-weight: bold; color: #8b949e;">発車標タイプ(型):</label>
        <select id="modelSelect" class="train-select" style="max-width: 180px; padding: 4px 8px; font-size: 13px;" onchange="changeModel(this.value)">
          <!-- 型マスターから動的生成 -->
        </select>
      </div>
      <a href="editor.html" target="_blank" style="padding: 6px 12px; background: #238636; border: 1px solid #2ea043; border-radius: 6px; color: #fff; text-decoration: none; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 5px;">
        ⚙️ データ管理・JSON生成 (別タブ)
      </a>
      <div class="header-info">
        ※ 実況モード（運行状況連動中）
      </div>
    </div>
  </header>

  <div class="board-container" id="boardContainer">
    <!-- 1〜4番線が動的にレンダリングされます -->
  </div>

  <div class="telop-container">
    <div class="telop-text" id="telopText">Nゲージ運行案内システム 稼働中</div>
  </div>

  <script>
    /* ==========================================================================
       1. 型マスター (MODEL_MASTER)
       新しい型フォルダが追加されたら、ここに設定を増やすだけでOKです。
       ========================================================================== */
    const MODEL_MASTER = {
      "default": {
        id: "default",
        name: "ルート直下 (標準)",
        dir: ".", // 画像フォルダ
        prefix: "", // 識別符号（空の場合は "種別-xxx.png" のように直下を参照）
        layout: {
          slotTypeWidth: 140,
          slotDestWidth: 150,
          slotCarsWidth: 85,
          slotHeight: 48
        },
        resolveImg: function(category, key) {
          if (!key) return "";
          if (this.prefix) {
            return `${this.dir}/${category}-${this.prefix}-${key}.png`;
          }
          return `${category}-${key}.png`;
        }
      },
      "渋谷南改札型": {
        id: "渋谷南改札型",
        name: "渋谷南改札型",
        dir: "渋谷南改札型",
        prefix: "渋谷南改札型",
        layout: {
          slotTypeWidth: 140,
          slotDestWidth: 150,
          slotCarsWidth: 85,
          slotHeight: 48
        },
        resolveImg: function(category, key) {
          if (!key) return "";
          return `${this.dir}/${category}-${this.prefix}-${key}.png`;
        }
      }
    };

    let currentModelId = "default";

    /* ==========================================================================
       2. 全型共通 内容マスター (TRAIN_MASTER)
       型に依存しない論理データ（車種名、各種別・行先・両数の識別キー、説明文など）
       ========================================================================== */
    let TRAIN_MASTER = {
      "成田エクスプレス (E259系)": {
        type_key: "特急成田エクスプレス15号",
        type_text: "特急 成田EXP",
        dest_key: "JO37成田空港",
        dest_text: "成田空港",
        cars_key: "6両",
        cars_text: "6両",
        desc: "特急成田エクスプレス（E259系）が走行中です。成田空港行きです。"
      },
      "東海道線 快速アクティー (E231系)": {
        type_key: "オレンジ快速アクティー.単体大",
        type_text: "快速アクティー",
        dest_key: "JT21熱海",
        dest_text: "熱海",
        cars_key: "15両",
        cars_text: "15両",
        desc: "東海道線 快速アクティー（熱海行き）です。グリーン車連結の15両編成です。"
      },
      "宇都宮線 普通 (E233系)": {
        type_key: "緑普通.宇都宮",
        type_text: "普通",
        dest_key: "JU宇都宮07宇都宮",
        dest_text: "宇都宮",
        cars_key: "10両",
        cars_text: "10両",
        desc: "宇都宮線 普通 宇都宮行きです。近郊型10両編成で運行中です。"
      },
      "湘南新宿ライン 特別快速 (E231系)": {
        type_key: "スカイブルー特別快速.単体大",
        type_text: "特別快速",
        dest_key: "JT16小田原",
        dest_text: "小田原",
        cars_key: "15両",
        cars_text: "15両",
        desc: "湘南新宿ライン 特別快速 小田原行きです。高崎線・東海道線直通です。"
      },
      "横須賀線 普通 (E235系/E217系)": {
        type_key: "緑普通.横須賀",
        type_text: "普通",
        dest_key: "JO01久里浜",
        dest_text: "久里浜",
        cars_key: "11両",
        cars_text: "11両",
        desc: "横須賀線 普通 久里浜行きです。11両編成で運行中です。"
      },
      "相鉄直通線 各駅停車 (12000系/E233系)": {
        type_key: "相鉄線",
        type_text: "各駅停車",
        dest_key: "海老名",
        dest_text: "海老名",
        cars_key: "10両",
        cars_text: "10両",
        desc: "相鉄線直通 各駅停車 海老名行きです。新宿方面からの直通列車です。"
      },
      "特急 湘南 (E257系)": {
        type_key: "特急湘南21号",
        type_text: "特急 湘南",
        dest_key: "JT14Odawara",
        dest_text: "小田原",
        cars_key: "9両",
        cars_text: "9両",
        desc: "特急 湘南号 小田原行きです。快適なリクライニングシート車両です。"
      },
      "回送 / 試運転": {
        type_key: "グレー普通.単体大",
        type_text: "回送",
        dest_key: "JS17大崎",
        dest_text: "回送",
        cars_key: "4両",
        cars_text: "4両",
        desc: "回送列車です。車内点検および試運転を実施しています。"
      }
    };

    const STATUS_MAP = {
      "running": { name: "● 走行中", class: "st-running" },
      "stopped": { name: "■ 停車中", class: "st-stopped" },
      "adjusting": { name: "▲ 調整中", class: "st-adjusting" },
      "suspended": { name: "× 見合わせ", class: "st-suspended" }
    };

    // 初期番線状態（実況モード）
    const trackStates = [
      { track: 1, train: "成田エクスプレス (E259系)", status: "running" },
      { track: 2, train: "東海道線 快速アクティー (E231系)", status: "running" },
      { track: 3, train: "宇都宮線 普通 (E233系)", status: "running" },
      { track: 4, train: "湘南新宿ライン 特別快速 (E231系)", status: "running" }
    ];

    // ローカルストレージにカスタム車両マスターがあれば適用
    const savedMaster = localStorage.getItem("custom_train_master");
    if (savedMaster) {
      try {
        TRAIN_MASTER = JSON.parse(savedMaster);
      } catch(e) {
        console.error("カスタムTRAIN_MASTERの読み込みに失敗しました", e);
      }
    }

    // 型選択セレクターの初期化
    function initModelSelector() {
      const select = document.getElementById("modelSelect");
      select.innerHTML = "";
      Object.keys(MODEL_MASTER).forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = MODEL_MASTER[key].name;
        if (key === currentModelId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // 型変更ハンドラー
    function changeModel(modelId) {
      if (MODEL_MASTER[modelId]) {
        currentModelId = modelId;
        applyModelLayout();
        renderBoard();
      }
    }

    // 型に合わせたCSSレイアウト変数の適用
    function applyModelLayout() {
      const model = MODEL_MASTER[currentModelId];
      if (!model || !model.layout) return;

      if (model.layout.slotTypeWidth) {
        document.querySelectorAll('.slot-type').forEach(el => el.style.width = model.layout.slotTypeWidth + 'px');
      }
      if (model.layout.slotDestWidth) {
        document.querySelectorAll('.slot-dest').forEach(el => el.style.width = model.layout.slotDestWidth + 'px');
      }
      if (model.layout.slotCarsWidth) {
        document.querySelectorAll('.slot-cars').forEach(el => el.style.width = model.layout.slotCarsWidth + 'px');
      }
    }

    function createSlotHTML(category, key, fallbackText, slotClass) {
      const model = MODEL_MASTER[currentModelId] || MODEL_MASTER["default"];
      const imgSrc = model.resolveImg(category, key);
      const fallbackImgSrc = MODEL_MASTER["default"].resolveImg(category, key);

      return `
        <div class="led-slot ${slotClass}">
          <img src="${imgSrc}" 
               onerror="if(this.src !== '${fallbackImgSrc}' && '${imgSrc}' !== '${fallbackImgSrc}') { this.src='${fallbackImgSrc}'; } else { this.style.display='none'; this.nextElementSibling.style.display='block'; }" 
               alt="${fallbackText}" />
          <span class="led-fallback-text" style="display:none;">${fallbackText}</span>
        </div>
      `;
    }

    function renderBoard() {
      const container = document.getElementById("boardContainer");
      container.innerHTML = "";

      trackStates.forEach((state, index) => {
        const trainData = TRAIN_MASTER[state.train] || {};
        const stData = STATUS_MAP[state.status] || STATUS_MAP.running;

        const row = document.createElement("div");
        row.className = "track-row";
        row.innerHTML = `
          <div class="track-badge">${state.track}番線</div>
          ${createSlotHTML("種別", trainData.type_key, trainData.type_text, "slot-type")}
          ${createSlotHTML("行先", trainData.dest_key, trainData.dest_text, "slot-dest")}
          ${createSlotHTML("編成", trainData.cars_key, trainData.cars_text, "slot-cars")}
          <div class="status-badge ${stData.class}">${stData.name}</div>
          
          <select class="train-select" onchange="changeTrain(${index}, this.value)">
            ${Object.keys(TRAIN_MASTER).map(key => `
              <option value="${key}" ${key === state.train ? "selected" : ""}>${key}</option>
            `).join("")}
          </select>

          <div class="status-btn-group">
            <button class="btn-status ${state.status === 'running' ? 'active' : ''}" onclick="changeStatus(${index}, 'running')">走行中</button>
            <button class="btn-status ${state.status === 'stopped' ? 'active' : ''}" onclick="changeStatus(${index}, 'stopped')">停車中</button>
            <button class="btn-status ${state.status === 'adjusting' ? 'active' : ''}" onclick="changeStatus(${index}, 'adjusting')">調整中</button>
            <button class="btn-status ${state.status === 'suspended' ? 'active' : ''}" onclick="changeStatus(${index}, 'suspended')">見合わせ</button>
          </div>
        `;
        container.appendChild(row);
      });

      applyModelLayout();
      updateTelop();
    }

    function changeTrain(index, trainName) {
      trackStates[index].train = trainName;
      renderBoard();
    }

    function changeStatus(index, status) {
      trackStates[index].status = status;
      renderBoard();
    }

    function updateTelop() {
      const messages = [];
      trackStates.forEach(state => {
        const train = TRAIN_MASTER[state.train];
        if (!train) return;
        if (state.status === "running") {
          messages.push(`【${state.track}番線 走行中】${train.desc}`);
        } else if (state.status === "stopped") {
          messages.push(`【${state.track}番線 停車中】${state.train} は現在ホームに停車中です。`);
        } else if (state.status === "adjusting") {
          messages.push(`【${state.track}番線 調整中】車両点検・調整作業を行っております。`);
        } else if (state.status === "suspended") {
          messages.push(`【${state.track}番線 見合わせ】安全確認のため運行を見合わせております。`);
        }
      });
      messages.push("【ご案内】模型には手を触れず、黄色い線の外側からご鑑賞ください。");

      const telopElem = document.getElementById("telopText");
      telopElem.textContent = messages.join("　◆　");
    }

    // スクロールテロップアニメーション
    const telopElem = document.getElementById("telopText");
    let pos = window.innerWidth;
    function animateTelop() {
      pos -= 2.2;
      if (pos < -telopElem.offsetWidth) {
        pos = window.innerWidth;
      }
      telopElem.style.transform = `translateX(${pos}px)`;
      requestAnimationFrame(animateTelop);
    }

    // 初期化実行
    initModelSelector();
    renderBoard();
    requestAnimationFrame(animateTelop);
  </script>
</body>
</html>
